<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 레트로 픽셀 폰트 로드 -->
<link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fcf6f9;
  --card-bg: #ffffff;
  --card-border: #f0d8e2;
  --point: #e89bb4;
  --point-dark: #c4728d;
  --accent: #b05a76;
  --sub: #a38290;
  --soft: #f7e6ed;
  --soft-bg: #fff9fc;
}

* {
  box-sizing: border-box;
}

body {
  background-color: var(--bg);
  font-family: 'DungGeunMo', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  padding: 20px 0;
  transition: background-color 0.2s, color 0.2s;
}

/* 📱 레트로 스마트폰 컨테이너 */
.room-container {
  background: var(--card-bg);
  border: 4px solid var(--card-border);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
  border-radius: 36px;
  width: 380px;
  padding: 38px 20px 30px 20px;
  position: relative;
  transition: background-color 0.2s, border-color 0.2s;
}

/* 스마트폰 상단 스피커 & 카메라 장식 */
.room-container::before {
  content: "";
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 5px;
  background: var(--card-border);
  border-radius: 3px;
}

.room-container::after {
  content: "";
  position: absolute;
  top: 13px;
  left: calc(50% + 35px);
  width: 5px;
  height: 5px;
  background: var(--card-border);
  border-radius: 50%;
}

/* 헤더 (모바일 상태바 & 캡슐형 주소 스타일) */
.room-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px dashed var(--card-border);
}

.browser-btn {
  width: 26px;
  height: 26px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  color: var(--accent);
  border-radius: 50%;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.browser-btn:hover {
  background: var(--soft);
}

/* 💊 캡슐형 주소바 스타일 */
.url-bar {
  background: var(--soft-bg);
  border: 2px solid var(--card-border);
  border-radius: 20px;
  padding: 5px 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 180px;
  overflow: hidden;
}

.url-icon {
  font-size: 9px;
  flex-shrink: 0;
}

.url-text {
  font-size: 9px;
  color: var(--accent);
  font-weight: bold;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 🔋 내부에 숫자가 들어간 배터리 모양 뱃지 */
.battery-badge {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.battery-body {
  width: 32px;
  height: 15px;
  border: 1.5px solid var(--accent);
  border-radius: 4px;
  padding: 1px;
  position: relative;
  background: var(--soft);
  display: flex;
  align-items: center;
  justify-content: center;
}

.battery-fill {
  position: absolute;
  top: 1px;
  left: 1px;
  bottom: 1px;
  width: 80%;
  background: var(--point);
  border-radius: 2px;
  z-index: 1;
}

.battery-text {
  position: relative;
  z-index: 2;
  font-size: 7px;
  color: var(--accent);
  font-weight: bold;
}

.battery-tip {
  width: 2px;
  height: 6px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

/* 🐾 CHARACTER BOX */
.character-box {
  background: var(--soft-bg);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 12px 0;
  padding: 14px;
}

.character {
  white-space: pre-wrap;
  font-family: monospace;
  font-size: 13px;
  line-height: 1.3;
  color: var(--accent);
  text-align: center;
}

.character-message {
  color: var(--accent);
  margin-top: 8px;
  font-size: 9px;
  background: var(--card-bg);
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
}

/* COUNT */
.count-section {
  text-align: center;
  margin: 16px 0;
  background: var(--soft-bg);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 14px;
}

.count {
  font-size: 30px;
  font-weight: bold;
  color: var(--accent);
}

.goal {
  font-size: 9px;
  color: var(--sub);
  margin-top: 4px;
}

.sync-status {
  font-size: 8px;
  color: var(--sub);
  margin-top: 3px;
  min-height: 10px;
  opacity: 0.7;
}

/* 🟩 PROGRESS BAR */
.progress {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 12px 0;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
}

.dot.active {
  background: var(--point);
  border-color: var(--point-dark);
}

/* 🕹️ WRITE BUTTONS */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 10px;
}

button {
  font-family: 'DungGeunMo', monospace;
  font-weight: bold;
  cursor: pointer;
}

.write-btn {
  padding: 8px 0;
  border: 2px solid var(--card-border);
  background: var(--soft);
  color: var(--accent);
  border-radius: 10px;
  font-size: 11px;
  transition: all 0.1s;
}

.write-btn:hover {
  background: var(--point);
  color: var(--card-bg);
}

.write-btn:active {
  transform: scale(0.95);
}

/* INFO */
.info {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
  padding: 8px;
  background: var(--soft-bg);
  border: 2px solid var(--card-border);
  border-radius: 12px;
  font-size: 10px;
  color: var(--sub);
}

.info strong {
  color: var(--accent);
}

/* CALENDAR */
.calendar-section {
  margin-top: 14px;
  text-align: left;
  background: var(--soft-bg);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 12px;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.month-title {
  font-size: 12px;
  font-weight: bold;
  color: var(--accent);
}

.month-btn {
  width: 22px;
  height: 22px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  color: var(--accent);
  border-radius: 6px;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.month-btn:hover {
  background: var(--soft);
}

.weekdays,
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.weekdays div {
  text-align: center;
  font-size: 9px;
  font-weight: bold;
  color: var(--sub);
  padding-bottom: 4px;
}

.day {
  min-height: 36px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  text-align: center;
  padding: 2px 1px;
  cursor: pointer;
  font-size: 9px;
  border-radius: 6px;
  transition: 0.1s;
}

.day:hover {
  background: var(--soft);
}

.day.today {
  border: 2px solid var(--point-dark);
  background: var(--soft-bg);
}

.day-number {
  font-weight: bold;
  color: var(--text);
}

.day-count {
  margin-top: 1px;
  font-size: 7px;
  color: var(--sub);
}

.day.done {
  background: var(--soft);
  border-color: var(--point);
}

.day.done .day-count {
  color: var(--accent);
  font-weight: bold;
}

/* MONTHLY STATS */
.monthly-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}

.stat-box {
  padding: 6px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  text-align: center;
}

.stat-label {
  font-size: 8px;
  color: var(--sub);
}

.stat-value {
  margin-top: 2px;
  font-size: 11px;
  font-weight: bold;
  color: var(--accent);
}

/* CUSTOMIZE BUTTON */
.customize-btn {
  width: 100%;
  margin-top: 14px;
  padding: 9px;
  border: 2px dashed var(--card-border);
  background: var(--card-bg);
  color: var(--accent);
  border-radius: 12px;
  font-size: 10px;
  transition: 0.1s;
}

.customize-btn:hover {
  background: var(--soft-bg);
  border-color: var(--point);
}

/* SETTINGS */
.settings {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  border-radius: 16px;
  text-align: left;
}

.settings.open {
  display: block;
}

.settings-title {
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  color: var(--accent);
  margin-bottom: 10px;
  border-bottom: 2px dashed var(--card-border);
  padding-bottom: 6px;
}

.setting-group {
  margin-bottom: 10px;
}

.setting-label {
  display: block;
  margin-bottom: 4px;
  font-size: 9px;
  font-weight: bold;
  color: var(--sub);
}

/* GOALS GRID (3개 나란히 배치) */
.goals-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.goals-grid input {
  width: 100%;
  padding: 6px 4px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  color: var(--accent);
  border-radius: 8px;
  font-family: 'DungGeunMo', monospace;
  font-size: 10px;
  font-weight: bold;
  text-align: center;
  outline: none;
}

.goals-grid input:focus {
  border-color: var(--point-dark);
}

/* INPUTS */
.setting-group input[type="text"],
.setting-group input[type="number"] {
  width: 100%;
  padding: 6px 8px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  color: var(--accent);
  border-radius: 8px;
  font-family: 'DungGeunMo', monospace;
  font-size: 11px;
  font-weight: bold;
  outline: none;
}

.setting-group input[type="text"]:focus,
.setting-group input[type="number"]:focus {
  border-color: var(--point-dark);
}

/* QUICK BUTTONS EDITORS */
.quick-btns-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.quick-btns-grid input {
  text-align: center;
  padding: 4px !important;
  font-size: 10px !important;
}

/* CHARACTER SELECT */
.character-select {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
}

.character-choice {
  padding: 6px 2px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  border-radius: 8px;
  font-size: 9px;
  color: var(--accent);
  cursor: pointer;
  text-align: center;
  font-family: 'DungGeunMo', monospace;
  font-weight: bold;
}

.character-choice:hover {
  background: var(--soft-bg);
}

.character-choice.selected {
  background: var(--soft);
  border-color: var(--point-dark);
}

/* TOGGLE */
.toggle-buttons {
  display: flex;
  gap: 4px;
}

.toggle-btn {
  flex: 1;
  padding: 5px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  color: var(--accent);
  border-radius: 8px;
  font-size: 9px;
}

.toggle-btn.selected {
  background: var(--soft);
  border-color: var(--point-dark);
}

/* THEME SELECT */
.theme-select {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}

.theme-btn {
  padding: 4px 2px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  text-align: center;
}

.theme-btn:hover {
  background: var(--soft-bg);
}

.theme-btn.selected {
  border-color: var(--point-dark);
  background: var(--soft);
}

/* CUSTOM POINT COLOR */
#pointColorInput {
  width: 100%;
  height: 28px;
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  border-radius: 8px;
  cursor: pointer;
  padding: 2px;
}

/* SETTINGS BOTTOM */
.settings-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}

.settings-bottom button {
  padding: 6px;
  font-size: 9px;
  border-radius: 8px;
}

.reset-btn {
  border: 2px solid var(--card-border);
  background: var(--card-bg);
  color: var(--sub);
}

.close-btn {
  border: 2px solid var(--card-border);
  background: var(--soft);
  color: var(--accent);
}

/* FOOTER / HOME BAR */
.footer {
  margin-top: 14px;
  text-align: center;
  font-size: 7px;
  color: var(--sub);
  position: relative;
}

.footer::before {
  content: "";
  display: block;
  width: 80px;
  height: 4px;
  background: var(--card-border);
  border-radius: 2px;
  margin: 0 auto 8px auto;
}
</style>
</head>

<body>

<!-- 📱 스마트폰 형태 컨테이너 -->
<div class="room-container">

  <!-- 세련된 모바일 상태바 스타일 헤더 -->
  <div class="room-header">
    <button class="browser-btn" onclick="location.reload()" title="홈 / 새로고침">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>
    
    <!-- 💊 캡슐형 주소 스타일 -->
    <div class="url-bar">
      <span class="url-icon">🔒</span>
      <div id="urlText" class="url-text">writing.room/cozy</div>
    </div>

    <!-- 🔋 내부에 숫자가 들어간 배터리 모양 뱃지 -->
    <div class="battery-badge">
      <div class="battery-body">
        <div class="battery-fill"></div>
        <span class="battery-text">100</span>
      </div>
      <div class="battery-tip"></div>
    </div>
  </div>

  <!-- CHARACTER -->
  <div class="character-box">
    <div id="character" class="character"></div>
    <div id="characterMessage" class="character-message"></div>
  </div>

  <!-- COUNT -->
  <div class="count-section">
    <div id="count" class="count">0</div>
    <div id="goalText" class="goal">GOAL 4,000 CHARACTERS</div>
    <div id="syncStatus" class="sync-status"></div>
  </div>

  <!-- PROGRESS -->
  <div id="progress" class="progress"></div>

  <!-- WRITE BUTTONS -->
  <div id="writeButtonsContainer" class="buttons"></div>

  <!-- INFO -->
  <div class="info">
    <div>🔥 STREAK <strong id="streak">0</strong></div>
    <div>⭐ EXP <strong id="exp">0</strong></div>
  </div>

  <!-- CALENDAR -->
  <div id="calendarSection" class="calendar-section">

    <div class="calendar-header">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div id="monthTitle" class="month-title"></div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="weekdays">
      <div>일</div>
      <div>월</div>
      <div>화</div>
      <div>수</div>
      <div>목</div>
      <div>금</div>
      <div>토</div>
    </div>

    <div id="calendar" class="calendar"></div>

    <div class="monthly-stats">
      <div class="stat-box">
        <div class="stat-label">WEEKLY WORDS</div>
        <div id="weeklyWords" class="stat-value">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">MONTHLY WORDS</div>
        <div id="monthlyWords" class="stat-value">0</div>
      </div>
    </div>

  </div>

  <!-- CUSTOMIZE -->
  <button id="customizeBtn" class="customize-btn" onclick="toggleSettings()">
    ⚙ ROOM SETTINGS
  </button>

  <!-- SETTINGS -->
  <div id="settings" class="settings">

    <div class="settings-title">
      ✦ ROOM SETTINGS ✦
    </div>

    <!-- ROOM PATH / NICKNAME -->
    <div class="setting-group">
      <span class="setting-label">ROOM PATH / NICKNAME</span>
      <input 
        id="roomPathInput" 
        type="text" 
        value="cozy" 
        placeholder="cozy" 
        oninput="setCustomRoomPath(this.value)"
      >
    </div>

    <!-- GOALS SETTING (나란히 배치) -->
    <div class="setting-group">
      <span class="setting-label">GOALS (DAILY / WEEKLY / MONTHLY)</span>
      <div class="goals-grid">
        <input 
          id="goalInput" 
          type="number" 
          value="4000" 
          step="100" 
          min="100" 
          title="Daily Goal"
          onchange="setCustomGoal(this.value)"
        >
        <input 
          id="weeklyGoalInput" 
          type="number" 
          value="28000" 
          step="1000" 
          min="100" 
          title="Weekly Goal"
          onchange="setCustomWeeklyGoal(this.value)"
        >
        <input 
          id="monthlyGoalInput" 
          type="number" 
          value="120000" 
          step="5000" 
          min="100" 
          title="Monthly Goal"
          onchange="setCustomMonthlyGoal(this.value)"
        >
      </div>
    </div>

    <!-- QUICK WRITE BUTTONS CONFIG -->
    <div class="setting-group">
      <span class="setting-label">QUICK BUTTONS (- / + / + / +)</span>
      <div class="quick-btns-grid">
        <input id="qBtn0" type="number" step="50" onchange="updateQuickButtonsFromSettings()">
        <input id="qBtn1" type="number" step="50" onchange="updateQuickButtonsFromSettings()">
        <input id="qBtn2" type="number" step="50" onchange="updateQuickButtonsFromSettings()">
        <input id="qBtn3" type="number" step="50" onchange="updateQuickButtonsFromSettings()">
      </div>
    </div>

    <!-- CHARACTER -->
    <div class="setting-group">
      <span class="setting-label">CHARACTER</span>
      <div class="character-select">
        <button id="char-hamster" class="character-choice" onclick="selectCharacter('hamster')">HAMSTER</button>
        <button id="char-cat" class="character-choice" onclick="selectCharacter('cat')">CAT</button>
        <button id="char-rabbit" class="character-choice" onclick="selectCharacter('rabbit')">RABBIT</button>
        <button id="char-bear" class="character-choice" onclick="selectCharacter('bear')">BEAR</button>
      </div>
    </div>

    <!-- CALENDAR -->
    <div class="setting-group">
      <span class="setting-label">CALENDAR</span>
      <div class="toggle-buttons">
        <button id="calendarOn" class="toggle-btn" onclick="setCalendarVisible(true)">ON</button>
        <button id="calendarOff" class="toggle-btn" onclick="setCalendarVisible(false)">OFF</button>
      </div>
    </div>

    <!-- THEME -->
    <div class="setting-group">
      <span class="setting-label">ROOM VIBE</span>
      <div class="theme-select">
        <button class="theme-btn" onclick="setTheme('pink')">🌸</button>
        <button class="theme-btn" onclick="setTheme('lavender')">💜</button>
        <button class="theme-btn" onclick="setTheme('blue')">💙</button>
        <button class="theme-btn" onclick="setTheme('mint')">🌿</button>
        <button class="theme-btn" onclick="setTheme('cream')">🥐</button>
        <button class="theme-btn" onclick="setTheme('black')">🖤</button>
      </div>
    </div>
  
    <!-- CUSTOM POINT COLOR -->
    <div class="setting-group">
      <span class="setting-label">ACCENT COLOR</span>
      <input
        id="pointColorInput"
        type="color"
        value="#e89bb4"
        onchange="setCustomPointColor(this.value)"
      >
    </div>

    <!-- SETTINGS BOTTOM -->
    <div class="settings-bottom">
      <button class="reset-btn" onclick="resetSettings()">DEFAULT</button>
      <button class="close-btn" onclick="toggleSettings()">CLOSE</button>
    </div>

  </div>

  <div class="footer">
    click a calendar date to edit ✦
  </div>

</div>

<script>
    let goal = parseInt(localStorage.getItem("dailyGoal")) || 4000;
    let weeklyGoal = parseInt(localStorage.getItem("weeklyGoal")) || 28000;
    let monthlyGoal = parseInt(localStorage.getItem("monthlyGoal")) || 120000;
    let roomPath = localStorage.getItem("roomPath") || "cozy";
    
    // 첫 번째는 마이너스(-), 두번째부터는 플러스(+) 기준값
    let quickButtonValues = JSON.parse(localStorage.getItem("quickButtonValues")) || [-400, 400, 800, 1000];
    
    const themes = {
      pink: { bg: "#fcf6f9", cardBg: "#ffffff", cardBorder: "#f0d8e2", soft: "#f7e6ed", softBg: "#fff9fc", text: "#5a404c", sub: "#a38290" },
      lavender: { bg: "#f7f5fc", cardBg: "#ffffff", cardBorder: "#e2dcf2", soft: "#eee8fc", softBg: "#faf8ff", text: "#464259", sub: "#8a83a3" },
      blue: { bg: "#f4f8fb", cardBg: "#ffffff", cardBorder: "#d6e5ef", soft: "#e6f1f8", softBg: "#fafcfd", text: "#3d4e5a", sub: "#7c93a4" },
      mint: { bg: "#f4faf7", cardBg: "#ffffff", cardBorder: "#d2ebd9", soft: "#e2f5e8", softBg: "#fafefc", text: "#3d5247", sub: "#799e8b" },
      cream: { bg: "#faf7f2", cardBg: "#ffffff", cardBorder: "#f0e2cc", soft: "#faebd0", softBg: "#fffdf9", text: "#534a3d", sub: "#9e9079" },
      black: { bg: "#1a1a1c", cardBg: "#242428", cardBorder: "#3a3a42", soft: "#2e2e36", softBg: "#2a2a30", text: "#e2e2e8", sub: "#9a9aa4" }
    };
    
    let selectedTheme = localStorage.getItem("selectedTheme") || "pink";
    let customPoint = localStorage.getItem("customPoint") || "";
    
    function applyTheme(themeName, customHex = null) {
      const theme = themes[themeName] || themes["pink"];
      const root = document.documentElement;
    
      root.style.setProperty("--bg", theme.bg);
      root.style.setProperty("--card-bg", theme.cardBg);
      root.style.setProperty("--card-border", theme.cardBorder);
      root.style.setProperty("--soft", theme.soft);
      root.style.setProperty("--soft-bg", theme.softBg);
      root.style.setProperty("--text", theme.text);
      root.style.setProperty("--sub", theme.sub);
    
      let pointColor = customHex;
      if (!pointColor) {
        const defaultPoints = {
          pink: "#e89bb4",
          lavender: "#b29ee8",
          blue: "#82bde8",
          mint: "#82d0af",
          cream: "#e0be82",
          black: "#8499b1"
        };
        pointColor = defaultPoints[themeName] || "#e89bb4";
      }
    
      const hex = pointColor.replace("#", "");
      const r = parseInt(hex.substring(0, 2), 16) || 0;
      const g = parseInt(hex.substring(2, 4), 16) || 0;
      const b = parseInt(hex.substring(4, 6), 16) || 0;
    
      let darkR = Math.round(r * 0.75);
      let darkG = Math.round(g * 0.75);
      let darkB = Math.round(b * 0.75);
      if (themeName === 'black' && !customHex) {
        darkR = 132; darkG = 153; darkB = 177;
      }
      const darkHex = "#" + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, "0")).join("");
    
      root.style.setProperty("--point", pointColor);
      root.style.setProperty("--point-dark", darkHex);
      root.style.setProperty("--accent", themeName === 'black' && !customHex ? "#9ab1cb" : darkHex);
    
      selectedTheme = themeName;
      localStorage.setItem("selectedTheme", themeName);
      
      const pointInput = document.getElementById("pointColorInput");
      if(pointInput) pointInput.value = pointColor;
    }
    
    function setTheme(themeName) {

        btn.className = "write-btn";
        if (index === 0) {
          const absVal = Math.abs(val);
          val = -absVal;
          btn.textContent = val;
        } else {
          const absVal = Math.abs(val);
          val = absVal;
          btn.textContent = "+" + val;
        }
        
        btn.onclick = function() {
          changeCount(val);
        };
        container.appendChild(btn);

        Math.abs(newVals[1]),
        Math.abs(newVals[2]),

    function getCharacterStage() {
      const ratio = count / goal;

      if (ratio < 0.50) return 1;

    function calculateStreak() {
      let streak = 0;
      const date = new Date();
      while (true) {
        const key = date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
        if (writingData[key] !== undefined && writingData[key] >= goal) {
          streak++;
          date.setDate(date.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      monthTitle.textContent = `${year}.${String(month + 1).padStart(2, "0")}`;
    
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

        calendar.appendChild(blank);
      }
    
      let monthlyWords = 0;

      const currDate = new Date();
      const currentDayOfWeek = currDate.getDay();
      const startOfWeek = new Date(currDate);
      startOfWeek.setDate(currDate.getDate() - currentDayOfWeek);

      for (let day = 1; day <= lastDate; day++) {
        const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const value = writingData[key] || 0;
        monthlyWords += value;

        const loopDate = new Date(year, month, day);
        if (loopDate >= startOfWeek && loopDate <= currDate) {
          weeklyWords += value;
        }
    
        const cell = document.createElement("div");
        cell.className = "day";
        if (key === todayKey) {

    // ── 자동 집계 (Python 카운터 연동) ───────────────────────────
    // Python이 폴더의 .txt 글자 수를 스캔해 직전 대비 증가분(델타)을 보내면
    // 기존 changeCount() 경로로 누적한다. 원본 데이터는 계속 localStorage가 갖는다.
    //
    // 주소를 명시한다. 상대 경로("/api/delta")로 두면 위젯을 파일로 직접 열었을 때
    // 브라우저가 로컬 파일의 네트워크 접근을 막아 동작하지 않는다.
    // "localhost"는 OS에 따라 IPv6(::1)로 먼저 해석될 수 있는데 서버는 127.0.0.1에
    // 바인딩되어 있으면 그때 연결이 거부되므로, 실패 시 127.0.0.1로 한 번 더 시도한다.
    // 포트를 바꾸려면 tracker.py의 --port와 이 값을 함께 바꿀 것.
    const SYNC_API_URLS = resolveSyncApiUrls();

    // 폴링 대상 주소 결정. 순서:
    //   1) window.__SYNC_API_BASE__ — 테스트가 주입한다. 전용 포트/서버를 쓰게 해
    //      실제로 떠 있는 위젯 탭(프로덕션 8000)과 통신이 뒤섞이지 않게 한다.
    //   2) <meta name="sync-api-base"> — index.html을 고치지 않고 브라우저로
    //      지정할 때 쓴다(파일 단위 배포본을 갈아끼울 때 유용).
    //   3) 기본값 — 로컬 개발용 localhost:8000.
    function resolveSyncApiUrls() {
      const DEFAULT_BASE = "http://localhost:8000";
      let fromMeta = "";
      // meta 조회는 선택 사항이다. querySelector가 없는 최소 DOM 대역(테스트 하네스)에서도
      // 죽지 않게 guarding한다 — 기본값으로 떨어지면 된다.
      try {
        const meta = document.querySelector('meta[name="sync-api-base"]');
        if (meta && meta.content) fromMeta = meta.content;
      } catch (_) { /* querySelector 미지원 환경 → 기본값 사용 */ }
      const raw =
        (typeof globalThis !== "undefined" && globalThis.__SYNC_API_BASE__) ||
        fromMeta ||
        DEFAULT_BASE;
      const base = String(raw).replace(/\/api\/delta\/?$/, "").replace(/\/+$/, "");
      return [base + "/api/delta", base.replace("localhost", "127.0.0.1") + "/api/delta"];
    }
    const SYNC_INTERVAL_MS = 10000;
    const SYNC_FAIL_THRESHOLD = 3;
    let syncFailCount = 0;
    let syncApiIndex = 0;

    // 폴링을 눈으로 확인하기 위한 로그. 브라우저 콘솔(F12)에서 본다.
    // 창이 열려 있는 동안만 동작하므로 10초마다 1줄씩 쌓인다.
    function syncLog(level, message, detail) {
      const stamp = new Date().toLocaleTimeString("ko-KR");
      const line = "[" + stamp + "][글자수카운터] " + message;
      if (level === "error") {
        console.error(line, detail === undefined ? "" : detail);
      } else if (level === "warn") {
        console.warn(line, detail === undefined ? "" : detail);
      } else {
        console.log(line, detail === undefined ? "" : detail);
      }
    }

    function updateSyncStatus() {
      const status = document.getElementById("syncStatus");
      if (!status) return;
      status.textContent = syncFailCount >= SYNC_FAIL_THRESHOLD
        ? "카운터 연결 안 됨"
        : "자동 집계 중";
    }

    function pollDelta() {
      const url = SYNC_API_URLS[syncApiIndex];
      fetch(url)
        .then((res) => res.json())
        .then((data) => {
          syncFailCount = 0;
          updateSyncStatus();
          if (data.delta > 0) {
            const before = count;
            changeCount(data.delta);
            syncLog("info",
              "새 글자 " + data.delta + "자 반영 (" + before + " → " + count + ")",
              { url: url, delta: data.delta, total: count, timestamp: data.timestamp });
          } else {
            syncLog("info", "변화 없음 (delta 0)", { url: url, timestamp: data.timestamp });
          }
        })
        .catch((err) => {
          // 서버가 꺼져 있으면 마지막 집계 값을 그대로 유지한다.
          syncFailCount++;
          if (syncApiIndex < SYNC_API_URLS.length - 1) {
            syncApiIndex++;   // 다음 주소로 넘어간다 (localhost → 127.0.0.1)
            syncLog("warn", "연결 실패 → 다른 주소로 재시도: " + SYNC_API_URLS[syncApiIndex],
              { tried: url, error: err && err.message });
            return;
          }
          updateSyncStatus();
          syncLog("error",
            "카운터 연결 실패 " + syncFailCount + "회 연속 (서버가 꺼져 있나 확인)",
            { tried: url, error: err && err.message });
        });
    }

    // 초기화 실행
    document.addEventListener("DOMContentLoaded", () => {
      applyTheme(selectedTheme, customPoint);
      updateThemeButtons();

      setCalendarVisible(calendarVisible);
      updateToday();

      updateSyncStatus();
      pollDelta();
      setInterval(pollDelta, SYNC_INTERVAL_MS);
    });
